<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Drafting Study</title>
<style>
  :root { --bg:#f6f8fc; --panel:#fff; --ink:#1f1f1f; --mute:#5f6368; --line:#dadce0; --accent:#0b57d0;
          --ins:#137333; --insbg:#e6f4ea; --del:#b3261e; --delbg:#fce8e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181c; --panel:#202124; --ink:#e8eaed; --mute:#9aa0a6; --line:#3c4043; --accent:#8ab4f8;
            --ins:#81c995; --insbg:#1e3a2a; --del:#f28b82; --delbg:#4a2523; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0 16px 0 0; font-weight:600; }
  .tab { border:0; background:none; color:var(--mute); padding:8px 14px; border-radius:16px; cursor:pointer; font:inherit; }
  .tab.active { background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); font-weight:600; }
  header .sp { flex:1; }
  button.btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:6px 12px; border-radius:16px; cursor:pointer; font:inherit; }
  button.btn:hover { background:var(--bg); }
  button.btn:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  @media (prefers-color-scheme: dark) { button.primary { color:#202124; } }
  main { flex:1; display:flex; min-height:0; }
  .view { flex:1; display:none; padding:16px; min-width:0; min-height:0; }
  .view.active { display:flex; flex-direction:column; }

  /* Compose window (Gmail-like) */
  .compose { max-width:760px; width:100%; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; flex:1; min-height:0; box-shadow:0 2px 8px #0002; }
  .compose .bar { background:#404040; color:#fff; padding:10px 14px; border-radius:10px 10px 0 0; font-weight:600; }
  .compose .row { display:flex; align-items:center; border-bottom:1px solid var(--line); padding:0 14px; }
  .compose .row label { color:var(--mute); width:60px; }
  .compose input { flex:1; border:0; outline:0; padding:10px 0; font:inherit; background:none; color:inherit; }
  .compose textarea { flex:1; border:0; outline:0; resize:none; padding:14px; font:inherit; background:none; color:inherit; }
  .compose .foot { padding:10px 14px; display:flex; gap:8px; align-items:center; border-top:1px solid var(--line); }
  .compose .foot .sp { flex:1; } .stat { color:var(--mute); font-size:12px; }
  .sentbanner { color:var(--ins); font-weight:600; }

  /* Assistant (plain chat) */
  .chat { max-width:760px; width:100%; margin:0 auto; display:flex; flex-direction:column; flex:1; min-height:0; }
  #msgs { flex:1; overflow:auto; display:flex; flex-direction:column; gap:14px; padding:8px 0; }
  .msg { max-width:88%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:color-mix(in srgb, var(--accent) 16%, var(--panel)); }
  .msg.assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .msg .tools { margin-top:6px; }
  .msg .tools button { border:0; background:none; color:var(--mute); cursor:pointer; font:inherit; font-size:12px; padding:2px 6px; border-radius:6px; }
  .msg .tools button:hover { background:var(--bg); }
  .hint { color:var(--mute); text-align:center; margin:auto; font-size:22px; }
  .inputbar { border:1px solid var(--line); border-radius:20px; background:var(--panel); padding:8px 10px; display:flex; gap:6px; align-items:flex-end; }
  .inputbar textarea { flex:1; border:0; outline:0; resize:none; font:inherit; background:none; color:inherit; min-height:44px; max-height:220px; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#323232; color:#fff; padding:10px 18px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; }

  /* Activity log overlay (researcher view) */
  #logview { position:fixed; inset:0; background:var(--bg); z-index:10; display:none; flex-direction:column; }
  #logview.open { display:flex; }
  #logview .top { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  #logview .top h2 { margin:0; font-size:15px; flex:1; }
  #logbody { overflow:auto; padding:16px; max-width:900px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  #summary { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; background:var(--panel); }
  .meta { display:flex; gap:8px; align-items:center; color:var(--mute); font-size:12px; margin-bottom:4px; flex-wrap:wrap; }
  .badge { padding:1px 8px; border-radius:10px; font-weight:600; color:#fff; font-size:11px; }
  .b-typed{background:#5f6368} .b-pasted{background:#b06000} .b-pastedai{background:#c2185b} .b-deleted{background:#b3261e} .b-cut{background:#b3261e}
  .b-undo{background:#7b1fa2} .b-other{background:#5f6368} .b-prompt{background:#0b57d0} .b-reply{background:#188038}
  .diff, .plain { white-space:pre-wrap; word-break:break-word; }
  ins { background:var(--insbg); color:var(--ins); text-decoration:none; }
  del { background:var(--delbg); color:var(--del); }
  .pause { text-align:center; color:var(--mute); font-size:12px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:3px 0; }
  .pause.long { color:#b06000; font-weight:600; }
  .tabrow { text-align:center; color:var(--mute); font-size:12px; }

  /* Email body + autocomplete overlay: a mirror div behind the transparent textarea shows the grey suggestion */
  .bodywrap { position:relative; flex:1; min-height:0; }
  .bodywrap textarea, .bodywrap .mirror { position:absolute; top:0; left:0; height:100%; margin:0; border:0; padding:14px;
    font:inherit; line-height:1.5; letter-spacing:normal; white-space:pre-wrap; overflow-wrap:break-word; word-break:normal; tab-size:8; }
  .bodywrap textarea { width:100%; z-index:1; background:transparent; }
  .bodywrap .mirror { color:transparent; pointer-events:none; overflow:hidden; z-index:0; }
  .mirror .ghost { color:var(--mute); }

  /* Source colours (log view) */
  .b-spellcheck{background:#1a73e8} .b-autocomplete{background:#00796b} .b-ac{background:#00796b}
  .final { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; white-space:pre-wrap; word-break:break-word; }
  .src-ai { background:color-mix(in srgb, #c2185b 22%, transparent); }
  .src-ai.edited { outline:1px dashed #c2185b; }
  .src-autocomplete { background:color-mix(in srgb, #00796b 25%, transparent); }
  .src-spellcheck { background:color-mix(in srgb, #1a73e8 25%, transparent); }
  .src-unknown { background:color-mix(in srgb, #b3261e 25%, transparent); text-decoration:underline wavy #b3261e; }
  /* Scenario card: visible on both tabs while writing */
  .scenario { max-width:760px; width:calc(100% - 32px); margin:12px auto 0; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:10px 14px; font-size:13px; }
  .scenario h3 { margin:0 0 4px; font-size:14px; }
  .scenario dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:2px 12px; }
  .scenario dt { color:var(--mute); }
  .scenario dd { margin:0; }
  .scenario .privacy { margin-top:6px; color:var(--mute); font-size:12px; }
  /* Log view filters: none selected = show everything */
  .filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; }
  .filters .lbl { color:var(--mute); margin-right:2px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:14px; padding:3px 10px; font:inherit; cursor:pointer; }
  .chip:hover { background:var(--bg); }
  .chip[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); font-weight:600; }
  .chip .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid var(--line); }
  .chip.clear { color:var(--accent); border-style:dashed; }
  .sw-deleted { background:#b3261e; } .sw-chat { background:#0b57d0; } .sw-other { background:#7b1fa2; }
  .final .dim { opacity:.3; background:none; outline:none; text-decoration:none; }
  .nomatch { color:var(--mute); text-align:center; padding:12px; }
  .b-aiedit { background:#880e4f; }
</style>
</head>
<body>
<header>
  <h1>✉️ Email Drafting</h1>
  <button class="tab active" data-tab="mail">Mail</button>
  <button class="tab" data-tab="chat">Assistant</button>
  <span class="sp"></span>
</header>
<div class="scenario" id="scenario" hidden>
  <h3 id="sc-title"></h3>
  <dl>
    <dt>Relationship</dt><dd id="sc-rel"></dd>
    <dt>Subject</dt><dd id="sc-subj"></dd>
    <dt>Your goal</dt><dd id="sc-goal"></dd>
  </dl>
  <div class="privacy" id="sc-privacy"></div>
</div>
<main>
  <section class="view active" id="view-mail">
    <div class="compose">
      <div class="bar">New Message</div>
      <div class="row"><label>To</label><input id="to" autocomplete="off"></div>
      <div class="row"><label>Subject</label><input id="subject" autocomplete="off"></div>
      <div class="bodywrap">
        <div class="mirror" id="mirror" aria-hidden="true"></div>
        <textarea id="body" placeholder="Write your email here…" spellcheck="true"></textarea>
      </div>
      <div class="foot">
        <button class="btn primary" id="send">Send</button>
        <span class="sentbanner" id="sentbanner"></span>
        <button class="btn" id="showlog" style="display:none">View activity log</button>
        <span class="sp"></span><span class="stat" id="wc">0 words</span>
      </div>
    </div>
  </section>

  <section class="view" id="view-chat">
    <div class="chat">
      <div id="msgs"><div class="hint" id="hint">How can I help you today?</div></div>
      <div class="inputbar">
        <textarea id="chatin" rows="1" placeholder="Message the assistant…"></textarea>
        <button class="btn primary" id="sendChat">Send</button>
      </div>
    </div>
  </section>
</main>

<div id="logview">
  <div class="top"><h2>Activity log</h2><button class="btn" id="dl-report">Download report</button><button class="btn" id="dl-edits">Edits CSV</button><button class="btn" id="dl-events">Events CSV</button><button class="btn" id="export">JSON</button><button class="btn" id="closelog">Close</button></div>
  <div id="logbody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const PID = params.get('pid') || 'anon';
const SID = Math.random().toString(36).slice(2, 8);
const START = Date.now();
// Autocomplete settings: wait this long after typing stops, suggest at most this many words,
// and only once the draft has at least minWords words.
const AC = { delayMs: 600, maxWords: 5, minWords: 2 };

// ---------- Event log (mirrored to server -> logs/<pid>.jsonl) ----------
const events = [];
let queue = [];
function logEvent(type, data = {}) {
  const e = { t: Date.now(), sid: SID, type, ...data };
  events.push(e); queue.push(e); return e;
}
async function flush() {
  if (!queue.length) return;
  const batch = queue; queue = [];
  try { await fetch('/api/log', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ pid: PID, events: batch }) }); }
  catch { queue = batch.concat(queue); }
}
setInterval(flush, 2000);
addEventListener('beforeunload', () => { if (queue.length) navigator.sendBeacon('/api/log', new Blob([JSON.stringify({ pid: PID, events: queue })], { type:'application/json' })); });

// ---------- Word-level diff ----------
const tokenize = s => s.split(/(\s+)/).filter(x => x !== '');
function wordDiff(a, b) {
  const A = tokenize(a), B = tokenize(b), n = A.length, m = B.length;
  if (n * m > 4e6) return [{ t:'del', s:a }, { t:'ins', s:b }];
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const ops = []; let i = 0, j = 0;
  const push = (t, s) => { const l = ops[ops.length-1]; if (l && l.t === t) l.s += s; else ops.push({ t, s }); };
  while (i < n && j < m) {
    if (A[i] === B[j]) { push('eq', A[i]); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) push('del', A[i++]);
    else push('ins', B[j++]);
  }
  while (i < n) push('del', A[i++]);
  while (j < m) push('ins', B[j++]);
  return ops;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const countWords = s => (s.match(/\S+/g) || []).length;
const diffHTML = ops => ops.map(o => o.t === 'ins' ? `<ins>${esc(o.s)}</ins>` : o.t === 'del' ? `<del>${esc(o.s)}</del>` : esc(o.s)).join('');
function diffStats(ops) { let add = 0, rem = 0; for (const o of ops) { if (o.t === 'ins') add += countWords(o.s); if (o.t === 'del') rem += countWords(o.s); } return { add, rem }; }
const norm = s => s.replace(/\s+/g, ' ').trim();

// ---------- Draft state, revisions, timeline ----------
const fields = { to: $('#to'), subject: $('#subject'), body: $('#body') };
const draft = { to: '', subject: '', body: '' };
const timeline = [];       // chronological: rev | pause | tab | prompt | reply | ac
const aiReplies = [];      // { id: 'R1', norm: normalized text }, to link pastes to the reply they came from
const PAUSE_MS = 1500;     // idle gap that counts as a pause and ends a typing burst
let openRev = null, revCount = 0, lastEditAt = START, firstEdit = true;
let currentTab = 'mail', tabSince = START, awayInChat = false, sent = false;

// ---------- Per-character source labels ----------
// One label per character of each field, kept in step with the text on every input:
//   'typed' | 'spellcheck' | 'autocomplete|S3' | 'ai|R2|P1' (reply R2, paste P1) | 'unknown'
const labels = { to: [], subject: [], body: [] };
const labelHistory = { to: new Map([['', []]]), subject: new Map([['', []]]), body: new Map([['', []]]) }; // text -> labels, restores labels on undo/redo
const aiPastes = {};       // P1 -> { reply: 'R2', edited: false }
let pasteCount = 0;
let clip = null;           // last in-app copy/cut: { text, labels? } from the email, or { text, replyId? } from the chat
let dragClip = null;       // text dragged within a field: { text, labels }
const findReply = text => { const t = norm(text); return t ? aiReplies.find(r => r.norm.includes(t)) : null; };
const pasteOf = k => (k && k.startsWith('ai|')) ? k.split('|')[2] : null;

function newAiPaste(replyId, n) {
  const p = 'P' + (++pasteCount);
  aiPastes[p] = { reply: replyId, edited: false };
  return Array(n).fill(`ai|${replyId}|${p}`);
}
function insertLabels(source, d, meta) {
  const n = d.ins.length; if (!n) return [];
  const fill = k => Array(n).fill(k);
  if (meta.acId) return fill('autocomplete|' + meta.acId);
  if (source === 'typed') return fill('typed');
  if (source === 'spellcheck') return fill('spellcheck');
  if (source === 'pasted') {
    const c = meta.inputType === 'insertFromDrop' ? dragClip : clip;
    if (c?.labels && c.text === d.ins) return c.labels.slice();               // moved/copied within the draft: keeps its labels
    if (c?.replyId && norm(c.text) === norm(d.ins)) return newAiPaste(c.replyId, n);
    const r = findReply(d.ins); if (r) return newAiPaste(r.id, n);
    return fill('unknown');                                                    // came from outside the app
  }
  return fill('unknown');                                                      // e.g. undo/redo with no stored state
}
// Exact edit range from the selection captured in beforeinput; falls back to a prefix/suffix diff
// (spellcheck replacements, undo/redo) when the selection doesn't explain the change.
function editDelta(prev, next, sel, type) {
  if (sel) {
    let [a, b] = sel; const k = prev.length - next.length;
    if (a === b && type) {
      if (/^delete.*Backward$/.test(type)) a = b - k;
      else if (/^delete.*Forward$/.test(type)) b = a + k;
    }
    if (a >= 0 && a <= b && b <= prev.length) {
      const ins = next.slice(a, next.length - (prev.length - b));
      if (prev.slice(0, a) + ins + prev.slice(b) === next) return { pos: a, del: prev.slice(a, b), ins };
    }
  }
  return charDelta(prev, next);
}
// Runs of equal labels -> [{start, end, source, reply_id?, paste_id?, suggestion_id?}]
function compressLabels(L) {
  const runs = [];
  L.forEach((k, i) => { const r = runs[runs.length - 1]; if (r && r.key === k) r.end = i + 1; else runs.push({ key: k, start: i, end: i + 1 }); });
  return runs.map(({ key, start, end }) => {
    const [source, a, b] = key.split('|'), r = { start, end, source };
    if (source === 'ai') { r.reply_id = a; r.paste_id = b; }
    if (source === 'autocomplete') r.suggestion_id = a;
    return r;
  });
}
// AI-pasted spans that a human changed: first to last surviving character of that paste
function aiEditedSpans(L) {
  const spans = {};
  L.forEach((k, i) => {
    const p = pasteOf(k); if (!p || !aiPastes[p].edited) return;
    (spans[p] ||= { start: i, paste_id: p, reply_id: aiPastes[p].reply }).end = i + 1;
  });
  return Object.values(spans);
}
function rememberLabels(field, val) {
  const m = labelHistory[field]; m.delete(val); m.set(val, labels[field].slice());
  if (m.size > 500) m.delete(m.keys().next().value);
}

function sourceOf(t) {
  if (!t) return 'other';
  if (t === 'insertFromPaste' || t === 'insertFromDrop' || t === 'insertFromYank' || t === 'insertFromPasteAsQuotation') return 'pasted';
  if (t === 'insertReplacementText') return 'spellcheck';
  if (t === 'deleteByCut') return 'cut';
  if (t.startsWith('delete')) return 'deleted';
  if (t === 'historyUndo' || t === 'historyRedo') return 'undo';
  if (t.startsWith('insert')) return 'typed';
  return 'other';
}
function charDelta(a, b) {
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let s = 0; while (s < a.length - p && s < b.length - p && a[a.length-1-s] === b[b.length-1-s]) s++;
  return { pos: p, del: a.slice(p, a.length - s), ins: b.slice(p, b.length - s) };
}
function notePause(now) {
  const gap = now - lastEditAt;
  if (gap >= PAUSE_MS) {
    openRev = null;
    const p = { kind:'pause', at: lastEditAt, ms: gap, first: firstEdit, where: awayInChat ? 'Assistant tab' : 'Mail tab' };
    timeline.push(p); logEvent('pause', { ms: gap, first: firstEdit, where: p.where });
  }
}
function recordChange(field, newVal, source, meta = {}) {
  const prev = draft[field];
  if (newVal === prev) return null;
  const now = Date.now();
  notePause(now);
  const d = editDelta(prev, newVal, meta.sel, meta.inputType);
  const L = labels[field];
  const delLabels = L.slice(d.pos, d.pos + d.del.length);
  const restored = source === 'undo' ? labelHistory[field].get(newVal) : null;
  const insL = restored ? null : insertLabels(source, d, meta);
  // A human change inside an AI paste (deleting any of its characters, or inserting between two of them)
  // marks that paste as an AI-edited span.
  let aiEdit = false;
  if (!restored && !meta.acId) {
    const touched = new Set(delLabels.map(pasteOf).filter(Boolean));
    // inside = the nearest AI character on each side belongs to the same paste (so typing next to
    // characters the participant already added inside the AI text still counts as inside it)
    let i = d.pos - 1, j = d.pos + d.del.length;
    while (i >= 0 && !pasteOf(L[i])) i--;
    while (j < L.length && !pasteOf(L[j])) j++;
    const left = pasteOf(L[i]), right = pasteOf(L[j]);
    if (d.ins && left && left === right && !insL.some(k => pasteOf(k) === left)) touched.add(left);
    touched.forEach(p => { aiPastes[p].edited = true; });
    aiEdit = touched.size > 0;
  }
  labels[field] = restored ? restored.slice() : [...L.slice(0, d.pos), ...insL, ...L.slice(d.pos + d.del.length)];
  if (labels[field].length !== newVal.length) {           // safety net: never let labels drift from the text
    logEvent('label_mismatch', { field, labels: labels[field].length, chars: newVal.length });
    labels[field] = labels[field].slice(0, newVal.length).concat(Array(Math.max(0, newVal.length - labels[field].length)).fill('unknown'));
  }
  rememberLabels(field, newVal);
  const fromAI = !!insL?.some(k => k.startsWith('ai|'));
  logEvent('edit', { field, source, inputType: meta.inputType || null, fromAI, aiEdit, ...d,
    insSources: restored ? 'restored' : compressLabels(insL),
    ...(d.del ? { delSources: compressLabels(delLabels), by: 'human' } : {}) });
  // a new revision starts when the field, the source, or "editing inside AI text" changes;
  // every paste and every accepted suggestion is a revision of its own
  const ownRev = source === 'pasted' || source === 'autocomplete';
  if (ownRev || !(openRev && openRev.field === field && openRev.source === source && openRev.aiEdit === aiEdit)) {
    openRev = { kind:'rev', id: ++revCount, field, source, aiEdit, startedAt: now, endedAt: now, before: prev, after: newVal, edits: 0, fromAI: false, insChars: '', delChars: '' };
    timeline.push(openRev);
  }
  openRev.after = newVal; openRev.endedAt = now; openRev.edits++;
  openRev.insChars += d.ins; openRev.delChars += d.del;    // exact characters, in the order they happened
  if (fromAI) openRev.fromAI = true;
  draft[field] = newVal; lastEditAt = now; firstEdit = false; awayInChat = false;

// ---------- Autocomplete: Smart Compose-style grey text drawn by a mirror div behind the textarea ----------
const mirror = $('#mirror'), bodyEl = fields.body;
function cleanSuggestion(s, body) {
  s = String(s || '').trim().split('\n')[0].replace(/^["“”]+|["“”]+$/g, '');
  const words = s.trim().split(/\s+/).filter(Boolean).slice(0, AC.maxWords).join(' ');
  if (!words) return '';
  return /\s$/.test(body) ? words : ' ' + words;
}
const ac = {
  timer: null, ctrl: null, seq: 0, count: 0, accepting: null,
  cur: null,   // { id, text, matched, shownAt, pos }: the suggestion on screen; `matched` = chars of it typed by hand
  render() {
    const g = this.cur ? this.cur.text.slice(this.cur.matched) : '';
    const ghost = document.createElement('span'); ghost.className = 'ghost'; ghost.textContent = g;
    mirror.replaceChildren(document.createTextNode(bodyEl.value), ghost);
    mirror.style.width = bodyEl.clientWidth + 'px';      // excludes the textarea's scrollbar so lines wrap identically
    mirror.scrollTop = bodyEl.scrollTop;
  },
  atEnd() {
    const n = bodyEl.value.length;
    return document.activeElement === bodyEl && bodyEl.selectionStart === n && bodyEl.selectionEnd === n;
  },
  schedule() {
    clearTimeout(this.timer);
    if (this.ctrl) { this.ctrl.abort(); this.ctrl = null; }
    if (sent || this.cur) return;
    this.timer = setTimeout(() => this.request(), AC.delayMs);
  },
  async request() {
    const text = bodyEl.value;
    // only at the end of the text, and only at a word boundary so the suggestion never has to finish a half-typed word
    if (sent || this.cur || !this.atEnd() || countWords(text) < AC.minWords || !/[\s.,!?;:]$/.test(text)) return;
    const seq = ++this.seq, ctrl = this.ctrl = new AbortController();
    try {
      const r = await fetch('/api/complete', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ subject: draft.subject, body: text }), signal: ctrl.signal });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Request failed');
      if (this.ctrl === ctrl) this.ctrl = null;
      const s = cleanSuggestion(data.text, text);
      if (!s) return;
      if (seq !== this.seq || bodyEl.value !== text || !this.atEnd() || sent || this.cur) {
        logEvent('autocomplete_dropped', { text: s, reason: 'stale' }); return;
      }
      this.cur = { id: 'S' + (++this.count), text: s, matched: 0, shownAt: Date.now(), pos: text.length };
      logEvent('autocomplete_shown', { suggestion_id: this.cur.id, text: s, pos: text.length, model: data.model });
      this.render();
    } catch (err) {
      if (err.name === 'AbortError') logEvent('autocomplete_dropped', { reason: 'kept_typing' });
      else logEvent('autocomplete_error', { error: String(err.message || err) });
    }
  },
  end(outcome, reason, extra = {}) {
    const c = this.cur; if (!c) return;
    this.cur = null;
    const e = { suggestion_id: c.id, text: c.text, outcome, reason, kept: c.text.slice(0, c.matched), visibleMs: Date.now() - c.shownAt, ...extra };
    logEvent(outcome === 'accepted' ? 'autocomplete_accepted' : 'autocomplete_dismissed', e);
    timeline.push({ kind:'ac', at: Date.now(), ...e });

  },
  dismiss(reason) { if (this.cur) this.end(this.cur.matched ? 'partial' : 'dismissed', reason); },
  accept() {

    if (!document.execCommand('insertText', false, rest)) {

      bodyEl.setRangeText(rest, n, n, 'end');
      bodyEl.dispatchEvent(new InputEvent('input', { inputType: 'insertText', data: rest }));
    }
    this.accepting = null;
    this.end('accepted', 'tab', { inserted: rest });
    this.schedule();
  },
  afterInput(d) {
    const c = this.cur;
    if (c && !this.accepting) {
      const rest = c.text.slice(c.matched);
      // typing the same characters the suggestion shows keeps it on screen (as in Gmail)
      if (d && !d.del && d.ins && d.pos + d.ins.length === draft.body.length && rest.startsWith(d.ins)) {
        c.matched += d.ins.length;
        if (c.matched >= c.text.length) this.end('typed_through', 'typed');
      } else this.dismiss(d && d.del && !d.ins ? 'deleted' : 'typed_other');
    }
    this.render();
    if (!this.accepting) this.schedule();

function onCopy(e) {

  if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) {
    const a = t.selectionStart, b = t.selectionEnd, text = t.value.slice(a, b);
    if (!text) return;

    logEvent(e.type, { tab: currentTab, field: f || 'chat_input', chars: text.length, text });
    return;
  }
  const s = getSelection(), text = String(s);
  if (!text) return;
  const node = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement);
  const replyId = node?.closest('.msg.assistant')?.dataset.rid || findReply(text)?.id || null;
  clip = { text, replyId };

}

function csvCell(v) {
  if (v === null || v === undefined) return '';
  let s = typeof v === 'object' ? JSON.stringify(v) : String(v);
  if (typeof v === 'string' && /^([=+@\t\r]|-[^\s\d])/.test(s)) s = "'" + s;   // stop Excel treating text as a formula
  return /[",\r\n]/.test(s) || s !== s.trim() ? `"${s.replace(/"/g, '""')}"` : s;
}

const EDIT_COLS = ['pid', 'session_id', 'condition', 'scenario_id', 'revision', 'field', 'source', 'inside_ai_text', 'filter_categories',
  'change_kind', 'change_size', 'words_added', 'words_removed', 'added_text', 'removed_text', 'chars_inserted', 'chars_deleted',
  'start_ms', 'end_ms', 'duration_ms', 'pause_before_ms', 'edit_count', 'start_time'];
// One row per revision (a burst of same-source edits), as in the log view.
// change_size: small = one word or less; large = adds/removes a whole sentence or 8+ words; otherwise medium.
function editsRows() {
  let prevEnd = START;
  return timeline.filter(x => x.kind === 'rev').map(x => {
    const ops = wordDiff(x.before, x.after), st = diffStats(ops);
    const pick = t => ops.filter(o => o.t === t).map(o => o.s.trim()).filter(Boolean).join(' … ');
    const added = pick('ins'), removed = pick('del');
    const kind = added && removed ? 'replacement' : added ? 'addition' : removed ? 'deletion' : 'whitespace';
    const words = Math.max(st.add, st.rem);
    const size = words <= 1 ? 'small' : (words >= 8 || /[.!?](\s|$)/.test(added + ' ' + removed) && words >= 3) ? 'large' : 'medium';
    const row = {
      pid: PID, session_id: SID, condition: CONDITION, scenario_id: scenario?.id || '',
      revision: x.id, field: x.field,
      source: x.source === 'pasted' ? (x.fromAI ? 'ai' : 'unknown') : x.source,
      inside_ai_text: x.aiEdit ? 'yes' : 'no', filter_categories: entryCats(x).join(' '),
      change_kind: kind, change_size: size, words_added: st.add, words_removed: st.rem, added_text: added, removed_text: removed,
      chars_inserted: x.insChars, chars_deleted: x.delChars,
      start_ms: x.startedAt - START, end_ms: x.endedAt - START, duration_ms: x.endedAt - x.startedAt,
      pause_before_ms: x.startedAt - prevEnd, edit_count: x.edits, start_time: new Date(x.startedAt).toISOString(),
    };
    prevEnd = x.endedAt;
    return row;
  });
}

  'text', 'reply_id', 'suggestion_id', 'outcome', 'reason', 'model', 'details'];

function eventsRows() {

    return { pid: PID, session_id: SID, condition: CONDITION, t_ms: t - START, time: new Date(t).toISOString(), type, field, source, pos,

const TIME = ms => new Date(ms).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
const SEC = ms => (ms / 1000).toFixed(1) + 's';
function renderLog() {

  const sum = src => ed.filter(e => e.source === src).reduce((n, e) => n + e.ins.length + e.del.length, 0);
  const aiPaste = ed.filter(e => e.fromAI).reduce((n, e) => n + e.ins.length, 0);
  const pauses = timeline.filter(x => x.kind === 'pause');
  const longest = pauses.reduce((m, p) => Math.max(m, p.ms), 0);
  const revs = timeline.filter(x => x.kind === 'rev').length;
  $('#logbody').innerHTML = `<div id="summary"><b>${esc(PID)}</b> · session ${SID} · ${SEC(Date.now() - START)} total<br>
    ${revs} revisions · typed ${ed.filter(e=>e.source==='typed').reduce((n,e)=>n+e.ins.length,0)} chars · pasted ${ed.filter(e=>e.source==='pasted').reduce((n,e)=>n+e.ins.length,0)} chars (${aiPaste} from AI) · deleted ${ed.reduce((n,e)=> n + (e.source==='typed'||e.source==='pasted' ? 0 : e.del.length),0)} chars<br>
    ${pauses.length} pauses ≥ ${PAUSE_MS/1000}s (total ${SEC(pauses.reduce((n,p)=>n+p.ms,0))}, longest ${SEC(longest)}) · ${history.filter(m=>m.role==='user').length} prompts to AI</div>` +
  `<div class="filters" id="filters"><span class="lbl">Show:</span>${FILTERS.map(f =>
      `<button class="chip" data-f="${f.key}" aria-pressed="${activeFilters.has(f.key)}"><span class="sw ${f.sw}"></span>${f.label}</button>`).join('')}
    <button class="chip clear" data-f="">Show all</button></div>` +
  `<div class="final">${finalEmailHTML() || '<i>(empty)</i>'}</div>` +
  timeline.map(x => {
    const cats = `data-cats="${entryCats(x).join(' ')}"`;
    if (x.kind === 'ac') {
      const what = { accepted: 'accepted', partial: `partly kept “${esc(x.kept)}”, then ${x.reason.replace('_', ' ')}`, dismissed: `dismissed (${x.reason.replace('_', ' ')})`, typed_through: 'typed out by hand' }[x.outcome];
      return `<div class="tabrow" ${cats}><span class="badge b-ac">Suggestion ${x.suggestion_id}</span> ${TIME(x.at)} “${esc(x.text)}” ${what} · shown ${SEC(x.visibleMs)}</div>`;
    }
    if (x.kind === 'pause') return `<div class="pause ${x.ms > 10000 ? 'long' : ''}" ${cats}>⏸ ${x.first ? 'Waited' : 'Paused'} ${SEC(x.ms)}${x.first ? ' before first edit' : ''} · ${TIME(x.at)} · ${x.where}</div>`;
    if (x.kind === 'tab') return `<div class="tabrow" ${cats}>↔ ${TIME(x.at)} switched ${x.from} → ${x.to} (was in ${x.from} for ${SEC(x.spent)})</div>`;
    if (x.kind === 'prompt') return `<div class="card" ${cats}><div class="meta"><span class="badge b-prompt">Prompt to AI</span><span>${TIME(x.at)}</span></div><div class="plain">${esc(x.text)}</div></div>`;
    if (x.kind === 'reply') return `<div class="card" ${cats}><div class="meta"><span class="badge b-reply">AI reply ${x.id || ''}</span><span>${TIME(x.at)}</span><span>${countWords(x.text)} words</span></div><div class="plain">${esc(x.text)}</div></div>`;
    const ops = wordDiff(x.before, x.after), st = diffStats(ops);
    const label = x.source === 'pasted' ? (x.fromAI ? 'Pasted from AI' : 'Pasted (outside / unknown)') : ({ typed:'Typed', spellcheck:'Spellcheck', autocomplete:'Autocomplete', deleted:'Deleted', cut:'Cut', undo:'Undo/Redo', other:'Other' })[x.source];
    const cls = x.source === 'pasted' && x.fromAI ? 'pastedai' : x.source;
    const net = (st.add || st.rem) ? `+${st.add} / −${st.rem} words` : 'no net word change';
    const aiTag = x.aiEdit ? `<span class="badge b-aiedit">Changes AI text</span>` : '';
    return `<div class="card" ${cats}><div class="meta"><span class="badge b-${cls}">${label}</span>${aiTag}<span>#${x.id} · ${x.field}</span><span>${TIME(x.startedAt)}</span><span>${net}</span><span>${x.edits} edit${x.edits>1?'s':''} · ${SEC(x.endedAt - x.startedAt)}</span></div><div class="diff">${diffHTML(ops)}</div></div>`;
  }).join('') + `<div class="nomatch" id="nomatch" hidden>No changes of the selected types.</div>`;
  $('#filters').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const f = b.dataset.f;
    if (!f) activeFilters.clear();
    else if (activeFilters.has(f)) activeFilters.delete(f); else activeFilters.add(f);
    logEvent('log_filter', { active: [...activeFilters] });
    applyFilters();
  };
  applyFilters();
}

// ---------- Log view filters ----------
// Several can be on at once (an entry shows if it matches any of them). None on = everything shown.
const FILTERS = [
  { key: 'typed',        label: 'Typed',                    sw: '' },
  { key: 'ai',           label: 'AI pasted',                sw: 'src-ai' },
  { key: 'aiedit',       label: 'AI, edited by participant', sw: 'src-ai edited' },
  { key: 'autocomplete', label: 'Autocomplete',             sw: 'src-autocomplete' },
  { key: 'spellcheck',   label: 'Spellcheck',               sw: 'src-spellcheck' },
  { key: 'unknown',      label: 'Unknown / outside',        sw: 'src-unknown' },
  { key: 'deleted',      label: 'Deletions',                sw: 'sw-deleted' },
  { key: 'chat',         label: 'AI chat',                  sw: 'sw-chat' },
  { key: 'other',        label: 'Undo / other',             sw: 'sw-other' },
];
const activeFilters = new Set();   // starts empty, so the log opens unfiltered
function entryCats(x) {
  if (x.kind === 'ac') return ['autocomplete'];                  // every suggestion: accepted, partly kept or rejected
  if (x.kind === 'prompt' || x.kind === 'reply') return ['chat'];
  if (x.kind !== 'rev') return ['context'];                       // pauses and tab switches: hidden while filtering
  const c = [];
  if (x.source === 'typed') c.push('typed');
  else if (x.source === 'spellcheck') c.push('spellcheck');
  else if (x.source === 'autocomplete') c.push('autocomplete');
  else if (x.source === 'deleted' || x.source === 'cut') c.push('deleted');
  else if (x.source === 'pasted') c.push(x.fromAI ? 'ai' : 'unknown');
  else c.push('other');
  if (x.aiEdit) c.push('aiedit');
  return c;
}
// Final email, one span per run of same-source characters, tagged with the filter categories it belongs to.
// Characters inside an AI paste the participant edited (the AI ones and the ones they typed) count as 'aiedit'.
function finalEmailHTML() {
  const spans = aiEditedSpans(labels.body);
  return compressLabels(labels.body).map(r => {
    const edited = r.paste_id && aiPastes[r.paste_id].edited ? ' edited' : '';
    const cats = [r.source === 'prefilled' ? 'typed' : r.source];
    if (spans.some(s => r.start >= s.start && r.end <= s.end)) cats.push('aiedit');
    const tip = r.source + (r.reply_id ? ` from ${r.reply_id} (${r.paste_id})` : '') + (r.suggestion_id ? ` ${r.suggestion_id}` : '');
    return `<span class="src-${r.source}${edited}" data-cats="${cats.join(' ')}" title="${esc(tip)}">${esc(draft.body.slice(r.start, r.end))}</span>`;
  }).join('');
}
// Self-contained (no outside variables) so the downloaded report can embed this exact function.
function applyFilterSet(active, root) {
  const on = active.size > 0;
  root.querySelectorAll('#filters .chip[data-f]').forEach(b => { if (b.dataset.f) b.setAttribute('aria-pressed', active.has(b.dataset.f)); });
  let shown = 0;
  root.querySelectorAll('[data-cats]').forEach(el => {
    const match = !on || el.dataset.cats.split(' ').some(c => active.has(c));
    if (el.closest('.final')) el.classList.toggle('dim', !match);
    else { el.hidden = !match; if (match) shown++; }
  });
  root.querySelector('#nomatch').hidden = !on || shown > 0;
}
const applyFilters = () => applyFilterSet(activeFilters, $('#logbody'));

logEvent('session_start', { userAgent: navigator.userAgent });
ac.render();
loadScenario();
</script>
